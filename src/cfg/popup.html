<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<!-- ==========================================================================
 * ARQUIVO: src/cfg/popup.html
 * PROJETO: JusGovBR - Seleção/Cópia Inteligente
 * AUTOR/CONTATO: smarca@gmail.com
 *
 * @MAPA-IA:
 * - Arquivo: src/cfg/popup.html
 * - Finalidade: Interface do Action Popup (janela rápida ao clicar no ícone da extensão)
 * - Componentes: Status da Extensão, Atalhos Rápidos para Opções/Sandbox, Contador de Itens em Memória
 * - Scripts Carregados: src/cfg/popup.js
 * ========================================================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JusGovBR - Painel de Controle Rápido</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <div class="marca-grupo">
            <div class="logo-container">
                <svg id="iconeHeaderSvg" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                    <rect id="iconeBg" x="6" y="6" width="116" height="116" rx="26" fill="#10b981" stroke="#059669" stroke-width="4"/>
                    <rect x="24" y="34" width="46" height="10" rx="3" fill="rgba(255,255,255,0.3)"/>
                    <rect x="24" y="54" width="34" height="10" rx="3" fill="rgba(255,255,255,0.3)"/>
                    <rect x="24" y="74" width="40" height="10" rx="3" fill="rgba(255,255,255,0.3)"/>
                    <polygon id="iconeRaio" points="78,20 44,68 68,68 54,108 100,56 74,56" fill="#fef08a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="titulo-cabecalho">
                <h1>JusGovBR Turbo</h1>
                <p>Seleção, Validação e Cópia de Textos Aprimorada.</p>
            </div>
        </div>
        <span id="badgeStatusGeral" class="badge-status">Ativo<br>(Global)</span>
    </header>

    <main>
        <div class="linha-topo-popup">
            <section class="cartao" id="cartaoPerfilPopup" style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px;">
                <label for="selectPerfilPopup" style="font-size: 11px; font-weight: 700; color: var(--texto-forte); white-space: nowrap;">Perfil de Uso</label>
                <select id="selectPerfilPopup" class="seletor-acao" aria-label="Perfil de Uso Ativo" style="flex: 1; min-width: 0; font-size: 11px; padding: 2px 5px; border: 1px solid #cbd5e1; border-radius: 5px; background: #ffffff;">
                    <option value="padrao">Padrão</option>
                    <option value="trabalho">Trabalho</option>
                    <option value="casa">Casa</option>
                    <option value="estudo">Estudo</option>
                    <option value="leitura">Leitura / Pesquisa</option>
                    <option value="reuniao">Apresentação / Reunião</option>
                </select>
            </section>
            <section class="cartao cartao-compacto-inativos" id="grupoInativosPopup" aria-label="Funcionalidades Desativadas" style="display: none;">
                <button type="button" class="btn-icone-inativo" id="btnIconeAutomateDesativado" title="Automação de Tarefas (Desativada) — clique para habilitar" aria-label="Habilitar Automação de Tarefas">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4.5" width="10" height="8" rx="2"/>
                        <path d="M8 2v2.5M5.8 8h.01M10.2 8h.01M6 10.5h4"/>
                    </svg>
                </button>
            </section>
        </div>
        <div id="avisoMiniTipPopup" role="status" aria-live="polite" style="display: none; background: rgba(15, 23, 42, 0.94); color: #f8fafc; border: 2px solid #2563eb; border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 700; text-align: center; white-space: pre-line; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);"></div>

        <section class="cartao grupo-colapsavel colapsado" id="cartaoMotorCopiaPopup">
            <div class="grupo-cabecalho" role="button" tabindex="0" aria-expanded="false" title="Passe o mouse ou clique para expandir/recolher os modos do Motor de Cópia">
                <span class="grupo-titulo-esq">
                    <span class="grupo-chevron" aria-hidden="true">▾</span>
                    <span>Motor de Cópia</span>
                </span>
                <span class="grupo-status-dir">
                    <span id="labelModoAtual">Todos os Sites</span>
                    <span class="indicador-status-discreto operacional" id="iconeStatusMotorCopia" aria-hidden="true">
                        <svg viewBox="0 0 16 16" width="9" height="9" fill="currentColor"><path d="M9.4 1.8 4.2 8.8h3.4l-.7 5.4 5.1-7H8.6z"/></svg>
                    </span>
                </span>
            </div>
            <div class="grupo-corpo">
                <div class="grade-modos">
                    <button type="button" class="btn-modo" id="btnModoGlobal" title="Funciona em qualquer site aberto no Chrome">
                        Todos os Sites
                    </button>
                    <button type="button" class="btn-modo modo-url" id="btnModoUrl" title="Funciona apenas nos sites cadastrados na lista">
                        Lista de Sites
                    </button>
                    <button type="button" class="btn-modo perigo" id="btnModoDesligado" title="Desativa temporariamente o motor de seleção">
                        Desligado
                    </button>
                </div>
                <div class="barra-dominio-atual" id="barraDominioAtual" style="display: none;">
                    <div class="info-dominio" id="infoDominioAba">Site: <strong>...</strong></div>
                    <button type="button" class="btn-alternar-dominio" id="btnAlternarDominioAba" title="Adiciona ou remove o site desta aba na lista">
                        + Incluir na Lista
                    </button>
                </div>
            </div>
        </section>

        <!-- Opcao Sistema Judicial Turbo (Anti-Ampulhetas: auto-colapsavel, visivel apenas em sistemas judiciais) -->
        <section class="cartao grupo-colapsavel colapsado" id="containerAmpuletas" style="display: none; flex-direction: column;">
            <div class="grupo-cabecalho grupo-cabecalho-discreto" role="button" tabindex="0" aria-expanded="false" title="Passe o mouse ou clique para configurar Anti-Ampulhetas">
                <span class="grupo-titulo-esq">
                    <span class="grupo-chevron" aria-hidden="true">▾</span>
                    <span id="tituloAmpuletas">Sistema Judicial Turbo</span>
                </span>
                <span class="grupo-status-dir">
                    <span class="indicador-status-discreto operacional" id="iconeStatusAmpuletas" title="Operacional" aria-hidden="true">
                        <svg viewBox="0 0 16 16" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>
                    </span>
                </span>
            </div>
            <div class="grupo-corpo">
                <div class="linha-switch" style="border-top: none; padding: 0;">
                    <div class="switch-texto">
                        <span class="switch-sub" id="subtituloAmpuletas">
                            Minimiza telas de bloqueios.
                        </span>
                    </div>
                    <label class="switch" title="Ativa ou desativa a ocultação de ampulhetas">
                        <input type="checkbox" id="checkAmpuletas" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Opcao Automacao de Tarefas (visivel aqui apenas se operacional; desativada vai em icone para #grupoInativosPopup) -->
        <section class="cartao grupo-colapsavel colapsado" id="containerAutomatePje" style="display: none; flex-direction: column;">
            <div class="grupo-cabecalho grupo-cabecalho-discreto" role="button" tabindex="0" aria-expanded="false" title="Passe o mouse ou clique para controlar a Automação de Tarefas">
                <span class="grupo-titulo-esq">
                    <span class="grupo-chevron" aria-hidden="true">▾</span>
                    <span>Automação de Tarefas</span>
                </span>
                <span class="grupo-status-dir">
                    <span class="indicador-status-discreto operacional" id="iconeStatusAutomate" title="Operacional" aria-hidden="true">
                        <svg viewBox="0 0 16 16" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>
                    </span>
                </span>
            </div>
            <div class="grupo-corpo">
                <div class="linha-switch" style="border-top: none; padding: 0;">
                    <div class="switch-texto">
                        <span class="switch-sub" id="subtituloAutomatePopup">
                            Automações hierárquicas do navegador (inclui pacote PJe).
                        </span>
                    </div>
                    <label class="switch" title="Ativa ou desativa a Automação de Tarefas">
                        <input type="checkbox" id="checkAutomatePje">
                        <span class="slider"></span>
                    </label>
                </div>
                <div id="barraAcoesAutomatePopup" style="display: none; gap: 4px; padding-top: 4px; margin-top: 4px; border-top: 1px dashed var(--borda-padrao);">
                    <button type="button" class="btn-modo ativo" id="btnExecutarAutomatePopup" style="flex: 1.1; padding: 3px 4px; font-size: 10px;" title="Disparar agora o fluxo do contexto atual">
                        ▶ Executar
                    </button>
                    <button type="button" class="btn-modo modo-url ativo" id="btnConfigurarAutomatePopup" style="flex: 1; padding: 3px 4px; font-size: 10px;" title="Configurar contexto, domínios de auto-ativação e parâmetros">
                        ⚙ Config
                    </button>
                    <button type="button" class="btn-modo perigo ativo" id="btnPararAutomatePopup" style="flex: 0.8; padding: 3px 4px; font-size: 10px;" title="Parar imediatamente qualquer ciclo em andamento">
                        ■ Parar
                    </button>
                    <button type="button" class="btn-modo" id="btnRestaurarBarraAutomatePopup" style="flex: 0 0 auto; width: 28px; padding: 3px 4px; display: inline-flex; align-items: center; justify-content: center;" title="Exibir ou ocultar a barra compacta na borda inferior desta aba" aria-label="Exibir ou ocultar barra">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div style="display: flex; align-items: stretch; gap: 5px; width: 100%;">
            <button type="button" class="btn-opcoes" id="btnAbrirOpcoes" style="flex: 1;">
                Abrir Opções e Central de Ajuda
            </button>
            <button type="button" id="btnBugsOnline" title="Reportar Bugs / Ajuda Online (GitHub)"
                style="display: inline-flex; align-items: center; justify-content: center; padding: 0 9px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; color: #b91c1c; cursor: pointer; transition: background-color 0.15s ease;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 2l1.88 1.88M14.12 3.88L16 2M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/>
                    <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/>
                    <path d="M12 20v-9M6.53 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.97 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
                </svg>
            </button>
        </div>
        <div class="rodape-nota" id="rodapeProdutividadeOnline" style="text-align: left; line-height: 1.25;" title="Contadores diários atualizados em tempo real (inatividade computada a partir de 3 min sem interação)"></div>
    </footer>

    <script src="../lib/lib-base-modulo.js"></script>
    <script src="../mod-produt/produt-bem-estar-cards.js"></script>
    <script src="../mod-produt/lib-produt-bem-estar.js"></script>
    <script src="../mod-produt/produt-resumo-ui.js"></script>
    <script src="../mod-produt/produt-sync-nuvem.js"></script>
    <script src="../mod-produt/produt-barra-injecao.js"></script>
    <script src="../mod-produt/produt-estado-trabalho.js"></script>
    <script src="../mod-produt/produt-motor-descanso.js"></script>
    <script src="../mod-produt/produt-motor-flexivel.js"></script>
    <script src="../mod-produt/produt-motor-ciclos.js"></script>
    <script src="../mod-produt/produt-barra-geometria.js"></script>
    <script src="../mod-produt/mod-produt.js"></script>
    <script src="popup-ui-helpers.js"></script>
    <script src="popup.js"></script>
</body>
</html>
