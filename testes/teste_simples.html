<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Simples</title>
</head>
<body>
    <pre id="resultado">Testando...</pre>
    <p id="paragrafo">Isto é um teste simples para selecionar palavras com um clique.</p>
    <script src="../src/mod-copia/ConstantesPadroes.js"></script>
    <script src="../src/mod-copia/AvisoFlutuante.js"></script>
    <script src="../src/mod-copia/AcumuladorCopia.js"></script>
    <script src="../src/mod-copia/SelecionarCopiar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const logs = [];
            const p = document.getElementById('paragrafo');
            const range = document.createRange();
            range.setStart(p.firstChild, 11); // 'teste'
            range.setEnd(p.firstChild, 16);
            const rect = range.getBoundingClientRect();
            const clickX = Math.round(rect.left + rect.width / 2);
            const clickY = Math.round(rect.top + rect.height / 2);
            
            p.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientX: clickX, clientY: clickY, button: 0, buttons: 1, detail: 1 }));
            p.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, clientX: clickX, clientY: clickY, button: 0, buttons: 0, detail: 1 }));
            p.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: clickX, clientY: clickY, button: 0, buttons: 0, detail: 1 }));
            
            await new Promise(r => setTimeout(r, 150));
            const sel = window.getSelection();
            logs.push('Resultado simples: "' + sel.toString() + '" (rangeCount=' + sel.rangeCount + ')');
            if (sel.rangeCount > 0) {
                const r = sel.getRangeAt(0);
                logs.push('Range collapsed=' + r.collapsed + ' text="' + r.toString() + '" node=' + r.startContainer.nodeName + ':' + r.startOffset);
            }
            document.getElementById('resultado').innerText = logs.join('\n');
        });
    </script>
</body>
</html>
