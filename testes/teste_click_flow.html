<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Click Flow</title>
</head>
<body>
    <pre id="resultado">Aguardando...</pre>
    <p id="paragrafo" style="font-size: 20px; font-family: sans-serif; padding: 20px;">PalavraUm PalavraDois PalavraTres PalavraQuatro</p>
    <script>
        const logs = [];
        const p = document.getElementById('paragrafo');
        
        document.addEventListener('selectionchange', () => {
            const s = window.getSelection();
            logs.push('selectionchange: text="' + s.toString() + '" isCollapsed=' + s.isCollapsed + ' ranges=' + s.rangeCount);
        });
        
        document.addEventListener('mousedown', (e) => {
            logs.push('mousedown: ' + e.target.tagName);
        }, true);
        
        document.addEventListener('mouseup', (e) => {
            logs.push('mouseup: ' + e.target.tagName);
            // Simulate what extension does: select 'PalavraDois'
            const r = document.createRange();
            r.setStart(p.firstChild, 11); // 'PalavraDois'
            r.setEnd(p.firstChild, 22);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
            logs.push('mouseup apos addRange: text="' + sel.toString() + '"');
        }, true);
        
        document.addEventListener('click', (e) => {
            const s = window.getSelection();
            logs.push('click: text="' + s.toString() + '" isCollapsed=' + s.isCollapsed);
        }, true);
        
        window.addEventListener('load', () => {
            // Emulate click with full mouse events
            const rect = p.getBoundingClientRect();
            const clickX = rect.left + 50;
            const clickY = rect.top + 10;
            
            p.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientX: clickX, clientY: clickY }));
            p.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, clientX: clickX, clientY: clickY }));
            p.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: clickX, clientY: clickY }));
            
            setTimeout(() => {
                const s = window.getSelection();
                logs.push('final setTimeout: text="' + s.toString() + '" isCollapsed=' + s.isCollapsed);
                document.getElementById('resultado').innerText = logs.join('\n');
            }, 50);
        });
    </script>
</body>
</html>
